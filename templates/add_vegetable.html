<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มผักใหม่</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}?v=1">
</head>
<body class="min-h-screen bg-green-50 text-slate-800">
    <div class="flex min-h-screen items-center justify-center px-4 py-10 sm:px-6">
        <div class="w-full max-w-2xl rounded-[32px] border border-emerald-100 bg-white p-8 shadow-2xl shadow-emerald-200/40">
            <div class="mb-8 text-center">
                <p class="text-sm uppercase tracking-[0.3em] text-emerald-500">Organic Veggie Warehouse</p>
                <h1 class="mt-3 text-3xl font-semibold text-slate-900">เพิ่มผักใหม่และสต็อก</h1>
                <p class="mt-2 text-sm text-slate-600">กรอกข้อมูลผักและรายละเอียดสต็อกให้ครบถ้วน</p>
            </div>
            <form method="post" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="veg_name" class="mb-2 block text-sm font-medium text-slate-700">ชื่อผัก</label>
                        <input id="veg_name" name="veg_name" type="text" required placeholder="เช่น ผักคะน้า"
                            class="w-full rounded-3xl border border-emerald-200 bg-emerald-50 px-5 py-4 text-sm text-slate-900 outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100">
                    </div>
                    <div>
                        <label for="category" class="mb-2 block text-sm font-medium text-slate-700">หมวดหมู่</label>
                        <select id="category" name="category" required class="w-full rounded-3xl border border-emerald-200 bg-emerald-50 px-5 py-4 text-sm text-slate-900 outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100">
                            <option value="" disabled selected>เลือกหมวดหมู่ผัก</option>
                            <option value="ผักใบ">ผักใบ</option>
                            <option value="ผักหัว">ผักหัว</option>
                            <option value="ผักผล">ผักผล</option>
                            <option value="ผักดอก">ผักดอก</option>
                            <option value="ผักราก">ผักราก</option>
                            <option value="สมุนไพร">สมุนไพร</option>
                            <option value="อื่นๆ">อื่น ๆ</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="storage_temp" class="mb-2 block text-sm font-medium text-slate-700">อุณหภูมิเก็บ (°C)</label>
                        <input id="storage_temp" name="storage_temp" type="number" step="0.1" required placeholder="เช่น 4.5"
                            class="w-full rounded-3xl border border-emerald-200 bg-emerald-50 px-5 py-4 text-sm text-slate-900 outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100">
                    </div>
                    <div>
                        <label for="farmer_option" class="mb-2 block text-sm font-medium text-slate-700">เกษตรกร</label>
                        <div class="space-y-2">
                            <select id="farmer_select" name="farmer_select" required class="w-full rounded-3xl border border-emerald-200 bg-emerald-50 px-5 py-4 text-sm text-slate-900 outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100">
                                <option value="" disabled selected>เลือกเกษตรกร</option>
                                {% for farmer in farmers %}
                                <option value="{{ farmer.farmer_id }}">{{ farmer.name }}</option>
                                {% endfor %}
                                <option value="new">เพิ่มเกษตรกรใหม่</option>
                            </select>
                            <input id="new_farmer_name" name="new_farmer_name" type="text" placeholder="กรอกชื่อเกษตรกรใหม่"
                                class="w-full rounded-3xl border border-emerald-200 bg-emerald-50 px-5 py-4 text-sm text-slate-900 outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100" style="display: none;">
                        </div>
                        <input type="hidden" id="farmer_id" name="farmer_id">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="zone_id" class="mb-2 block text-sm font-medium text-slate-700">โซนเก็บ</label>
                        <select id="zone_id" name="zone_id" required class="w-full rounded-3xl border border-emerald-200 bg-emerald-50 px-5 py-4 text-sm text-slate-900 outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100">
                            <option value="" disabled selected>เลือกโซนเก็บ</option>
                            {% for zone in zones %}
                            <option value="{{ zone.zone_id }}">{{ zone.zone_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label for="quantity" class="mb-2 block text-sm font-medium text-slate-700">จำนวน (กิโลกรัม)</label>
                        <input id="quantity" name="quantity" type="number" min="1" required placeholder="เช่น 100"
                            class="w-full rounded-3xl border border-emerald-200 bg-emerald-50 px-5 py-4 text-sm text-slate-900 outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="receive_date" class="mb-2 block text-sm font-medium text-slate-700">วันที่รับเข้า</label>
                        <input id="receive_date" name="receive_date" type="date" required
                            class="w-full rounded-3xl border border-emerald-200 bg-emerald-50 px-5 py-4 text-sm text-slate-900 outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100">
                    </div>
                    <div>
                        <label for="expiry_date" class="mb-2 block text-sm font-medium text-slate-700">วันที่หมดอายุ</label>
                        <input id="expiry_date" name="expiry_date" type="date" required
                            class="w-full rounded-3xl border border-emerald-200 bg-emerald-50 px-5 py-4 text-sm text-slate-900 outline-none transition focus:border-emerald-400 focus:ring-4 focus:ring-emerald-100">
                    </div>
                </div>
                <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                    <button type="submit" class="inline-flex w-full items-center justify-center rounded-full bg-emerald-700 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-emerald-300/40 hover:bg-emerald-600 transition sm:w-auto">เพิ่มข้อมูล</button>
                    <a href="{{ url_for('vegetables') }}" class="inline-flex w-full items-center justify-center rounded-full border border-emerald-200 bg-white px-6 py-3 text-sm font-semibold text-emerald-700 shadow-sm hover:bg-emerald-50 transition sm:w-auto">กลับไปรายการผัก</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        const farmerSelect = document.getElementById('farmer_select');
        const newFarmerInput = document.getElementById('new_farmer_name');
        const farmerIdHidden = document.getElementById('farmer_id');
        const form = document.querySelector('form');

        function updateFarmerFields() {
            if (farmerSelect.value === 'new') {
                newFarmerInput.style.display = 'block';
                newFarmerInput.required = true;
                farmerIdHidden.value = '';
            } else if (farmerSelect.value !== '') {
                newFarmerInput.style.display = 'none';
                newFarmerInput.required = false;
                newFarmerInput.value = '';
                farmerIdHidden.value = farmerSelect.value;
            }
        }

        farmerSelect.addEventListener('change', updateFarmerFields);

        form.addEventListener('submit', function(e) {
            if (farmerSelect.value === 'new' && newFarmerInput.value.trim() === '') {
                e.preventDefault();
                alert('กรุณากรอกชื่อเกษตรกรใหม่');
                newFarmerInput.focus();
                return false;
            }
            if (farmerSelect.value === '' || farmerSelect.value === null) {
                e.preventDefault();
                alert('กรุณาเลือกเกษตรกร');
                farmerSelect.focus();
                return false;
            }
        });

        // Initial setup
        updateFarmerFields();
    </script>
</body>
</html>
