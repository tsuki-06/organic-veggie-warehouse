<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Veggie Warehouse - จัดการเกษตรกร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}?v=1">
</head>
<body class="min-h-screen bg-emerald-50 text-slate-800">
    <header class="bg-emerald-800 text-emerald-50 shadow-md">
        <div class="mx-auto max-w-7xl px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div>
                <p class="text-sm uppercase tracking-[0.25em] text-emerald-200">Organic Veggie Warehouse</p>
                <h1 class="text-2xl font-semibold">หน้าจัดการเกษตรกร</h1>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <a href="{{ url_for('index') }}" class="rounded-full bg-emerald-200 px-4 py-2 text-emerald-900 hover:bg-emerald-100 transition">กลับหน้าหลัก</a>
                <a href="{{ url_for('vegetables') }}" class="rounded-full bg-emerald-200 px-4 py-2 text-emerald-900 hover:bg-emerald-100 transition">จัดการผัก</a>
            </div>
        </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
        <section class="mb-6 rounded-3xl border border-emerald-100 bg-white p-5 shadow-sm">
            <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                <div>
                    <h2 class="text-xl font-semibold text-slate-900">รายชื่อเกษตรกร</h2>
                    <p class="text-sm text-slate-600">ดูข้อมูลเกษตรกรที่ส่งผักเข้าคลัง</p>
                </div>
            </div>
        </section>

        <section class="overflow-x-auto rounded-3xl bg-emerald-100/80 p-4 shadow-sm">
            <table class="min-w-full divide-y divide-emerald-200 text-sm">
                <thead class="bg-emerald-900 text-white">
                    <tr>
                        <th class="px-4 py-3 text-left uppercase tracking-wide">farmer_id</th>
                        <th class="px-4 py-3 text-left uppercase tracking-wide">ชื่อ</th>
                        <th class="px-4 py-3 text-left uppercase tracking-wide">เบอร์โทรศัพท์</th>
                        <th class="px-4 py-3 text-left uppercase tracking-wide">ที่อยู่</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-emerald-100 bg-white">
                    {% for farmer in farmers %}
                    <tr class="hover:bg-emerald-50">
                        <td class="px-4 py-4">{{ farmer[0] }}</td>
                        <td class="px-4 py-4">{{ farmer[1] }}</td>
                        <td class="px-4 py-4">{{ farmer[2] or '-' }}</td>
                        <td class="px-4 py-4">{{ farmer[3] or '-' }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
